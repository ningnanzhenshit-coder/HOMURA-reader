<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="orchid" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" id="homuraThemeColor" content="#F8FAFC" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>HOMURA — ACGN GO 本地漫画与轻小说阅读器</title>
  <link rel="preload" as="image" href="./splash-icon.png" fetchpriority="high" />
  <style>
    /* 启动层直接写进入口，首帧即可覆盖 WebView 的默认底色 */
    html.homura-splashing,
    html.homura-splashing body {
      overflow: hidden;
      overscroll-behavior: none;
      scrollbar-gutter: auto;
    }
    #homura-splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #FFFFFF;
      opacity: 1;
      touch-action: none;
      transition: opacity 200ms cubic-bezier(0.2, 0, 0, 1);
    }
    html.homura-native-splash #homura-splash__icon {
      animation: none;
      opacity: 1;
      transform: none;
    }
    #homura-splash.is-leaving {
      opacity: 0;
      pointer-events: none;
    }
    #homura-splash__icon {
      display: block;
      width: clamp(9rem, 16vw, 14rem);
      height: auto;
      max-width: 56vw;
      user-select: none;
      -webkit-user-drag: none;
      animation: homura-splash-reveal 200ms cubic-bezier(0.2, 0, 0, 1) both;
    }
    @media (max-width: 767px) {
      #homura-splash__icon {
        width: clamp(8rem, 32vw, 10rem);
      }
    }
    @keyframes homura-splash-reveal {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #homura-splash,
      #homura-splash__icon {
        animation: none;
        transition: none;
      }
    }
  </style>
  <!-- 引导逻辑抽到 public/homura-boot.js：CSP 的 script-src 不含 'unsafe-inline'，内联脚本会被拦死 -->
  <script src="./homura-boot.js"></script>
  <!-- 与桌面应用统一的 HOMURA 透明圆角图标 -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script src="vendor/tailwind.js"></script>
  <script src="vendor/tailwind-config.js"></script>
</head>
<body class="min-h-screen flex flex-col font-sans select-none transition-colors duration-200">
  <div id="homura-splash" role="status" aria-label="HOMURA 正在启动">
    <img id="homura-splash__icon" src="./splash-icon.png" alt="" draggable="false" fetchpriority="high" />
  </div>
  <div id="app" class="flex-1 flex flex-col"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
