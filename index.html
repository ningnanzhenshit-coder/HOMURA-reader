<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="blue" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" id="homuraThemeColor" content="#F8FAFC" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>HOMURA — ACGN GO 本地漫画与轻小说阅读器</title>
  <link rel="preload" as="image" href="./splash-icon.png" fetchpriority="high" />
  <style>
    /* 启动层直接写进入口，首帧即可覆盖 WebView 的默认底色 */
    html.homura-splashing,
    html.homura-splashing body {
      overflow: hidden;
      overscroll-behavior: none;
      scrollbar-gutter: auto;
    }
    #homura-splash {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #FFFFFF;
      opacity: 1;
      touch-action: none;
      transition: opacity 200ms cubic-bezier(0.2, 0, 0, 1);
    }
    html.homura-native-splash #homura-splash__icon {
      animation: none;
      opacity: 1;
      transform: none;
    }
    #homura-splash.is-leaving {
      opacity: 0;
      pointer-events: none;
    }
    #homura-splash__icon {
      display: block;
      width: clamp(9rem, 16vw, 14rem);
      height: auto;
      max-width: 56vw;
      user-select: none;
      -webkit-user-drag: none;
      animation: homura-splash-reveal 200ms cubic-bezier(0.2, 0, 0, 1) both;
    }
    @media (max-width: 767px) {
      #homura-splash__icon {
        width: clamp(8rem, 32vw, 10rem);
      }
    }
    @keyframes homura-splash-reveal {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #homura-splash,
      #homura-splash__icon {
        animation: none;
        transition: none;
      }
    }
  </style>
  <script>
    // Android 系统启动页退出后，用同尺寸静态图标无缝接棒到 WebView
    if (/Android/i.test(navigator.userAgent) && location.hostname === 'tauri.localhost') {
      document.documentElement.classList.add('homura-native-splash');
    }
    window.__HOMURA_SPLASH_STARTED_AT__ = performance.now();
    document.documentElement.classList.add('homura-splashing');

    // 在首帧渲染前同步恢复主题色与阅读模式，避免启动时从亮色闪到夜间模式
    (function () {
      try {
        var theme = localStorage.getItem('homura_theme_color');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        var mode = localStorage.getItem('homura_surface_mode');
        if (mode) {
          document.documentElement.setAttribute('data-mode', mode);
          if (mode === 'dark') document.documentElement.classList.add('dark');
        }
        // 移动端浏览器地址栏跟随阅读表面底色，避免启动瞬间白条
        var canvases = { light: '#F8FAFC', warm: '#FAF6EE', dark: '#0F1115' };
        var meta = document.getElementById('homuraThemeColor');
        if (meta && !mode) meta.setAttribute('content', canvases.light);
        if (meta && mode && canvases[mode]) meta.setAttribute('content', canvases[mode]);
      } catch (e) {}
    })();
  </script>
  <!-- 与桌面应用统一的 HOMURA 透明圆角图标 -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script src="vendor/tailwind.js"></script>
  <script src="vendor/tailwind-config.js"></script>
</head>
<body class="min-h-screen flex flex-col font-sans select-none transition-colors duration-200">
  <div id="homura-splash" role="status" aria-label="HOMURA 正在启动">
    <img id="homura-splash__icon" src="./splash-icon.png" alt="" draggable="false" fetchpriority="high" />
  </div>
  <div id="app" class="flex-1 flex flex-col"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
