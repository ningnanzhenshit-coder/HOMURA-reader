<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="blue" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" id="homuraThemeColor" content="#F8FAFC" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>HOMURA — ACGN GO 本地漫画与轻小说阅读器</title>
  <script>
    // 在首帧渲染前同步恢复主题色与阅读模式，避免启动时从亮色闪到夜间模式
    (function () {
      try {
        var theme = localStorage.getItem('homura_theme_color');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        var mode = localStorage.getItem('homura_surface_mode');
        if (mode) {
          document.documentElement.setAttribute('data-mode', mode);
          if (mode === 'dark') document.documentElement.classList.add('dark');
        }
        // 移动端浏览器地址栏跟随阅读表面底色，避免启动瞬间白条
        var canvases = { light: '#F8FAFC', warm: '#FAF6EE', dark: '#0F1115' };
        var meta = document.getElementById('homuraThemeColor');
        if (meta && !mode) meta.setAttribute('content', canvases.light);
        if (meta && mode && canvases[mode]) meta.setAttribute('content', canvases[mode]);
      } catch (e) {}
    })();
  </script>
  <!-- Favicon: HOMURA 红色圆角方块 + 白毛猫耳少女 + 金色打开的书 -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="vendor/tailwind.js"></script>
  <script src="vendor/tailwind-config.js"></script>
</head>
<body class="min-h-screen flex flex-col font-sans select-none transition-colors duration-200">
  <div id="app" class="flex-1 flex flex-col"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
