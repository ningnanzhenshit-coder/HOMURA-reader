name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles deb,rpm
            rust_targets: ''
          - name: Windows
            platform: windows-latest
            args: ''
            rust_targets: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      # 根据上一个 tag 到当前 tag 的 Conventional Commits 自动生成更新日志
      - name: Generate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-notes.mjs

      # 有 tag 推送时自动创建草稿 Release；手动触发时只上传构建产物。
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'HOMURA v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: homura-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build (Android APK)
    runs-on: ubuntu-latest
    # 等桌面端跑完，tag 推送时草稿 Release 已经存在，APK 才能附上去
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接复用 runner 预装的 Android SDK：setup-android v3 会执行已下线的
      # `sdkmanager tools` 导致失败（Failed to find package 'tools'）
      - name: Setup Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          NDK_DIR=$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            "$SDKMANAGER" --install "ndk;27.0.12077973"
            NDK_DIR="$SDK_ROOT/ndk/27.0.12077973"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-android

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Android project
        run: npx tauri android init

      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/gen/android/app/homura-release.jks
        run: |
          set -euo pipefail

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

          # `tauri android init` 每次都会重新生成项目，因此在生成后注入 release 签名配置。
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          source = path.read_text()
          build_types_marker = "    buildTypes {"
          release_marker = '        getByName("release") {'

          if source.count(build_types_marker) != 1 or source.count(release_marker) != 1:
              raise SystemExit("Unexpected generated Android build.gradle.kts layout")

          signing_config = "\n".join(
              [
                  "    signingConfigs {",
                  '        create("release") {',
                  "            storeFile = file(",
                  '                requireNotNull(System.getenv("ANDROID_KEYSTORE_PATH")) {',
                  '                    "ANDROID_KEYSTORE_PATH is not set"',
                  "                }",
                  "            )",
                  '            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")',
                  '            keyAlias = System.getenv("ANDROID_KEY_ALIAS")',
                  '            keyPassword = System.getenv("ANDROID_KEY_PASSWORD")',
                  "        }",
                  "    }",
                  "",
                  "",
              ]
          )
          source = source.replace(
              build_types_marker, signing_config + build_types_marker, 1
          )
          source = source.replace(
              release_marker,
              release_marker
              + '\n            signingConfig = signingConfigs.getByName("release")',
              1,
          )
          path.write_text(source)
          PY

      # 只出 arm64-v8a（覆盖绝大多数设备），用正式 keystore 签名并剔除调试信息。
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/gen/android/app/homura-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: npx tauri android build --apk --split-per-abi -t aarch64

      - name: Verify signed release APK
        run: |
          set -euo pipefail

          APK=$(find src-tauri/gen/android/app/build/outputs/apk/arm64/release \
            -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f \
            | sort -V | tail -1)
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: homura-android-arm64-release
          path: src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec \
            gh release upload "${GITHUB_REF_NAME}" {} --clobber \;
