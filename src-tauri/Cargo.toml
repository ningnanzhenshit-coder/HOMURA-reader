[package]
name = "homura-reader"
version = "2.1.2"
description = "HOMURA — ACGN GO 本地漫画与轻小说阅读器"
authors = ["HOMURA"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "homura_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
