[package]
name = "homura-reader"
version = "2.1.8"
description = "HOMURA — ACGN GO 本地漫画与轻小说阅读器"
authors = ["HOMURA"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "homura_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
tauri-plugin-android-toast = { path = "plugins/android-toast" }
tauri-plugin-android-predictive-back = { path = "plugins/android-predictive-back" }
tauri-plugin-android-installer = { path = "plugins/android-installer" }

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
